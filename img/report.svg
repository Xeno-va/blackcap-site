<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="Inter, Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="758" height="618" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
<text x="32" y="56" font-size="24" font-weight="700" fill="#f8fafc">Tuesday morning</text>
<text x="32" y="84" font-size="15" fill="#94a3b8">6 wells · 2 need you today · 2 to check · 2 fine</text>
<text x="728" y="56" font-size="13" fill="#64748b" text-anchor="end">Sample report</text>
<rect x="24" y="120" width="712" height="72" rx="12" fill="#111c33"/>
<circle cx="52" cy="156" r="8" fill="#ef4444"/>
<text x="74" y="151" font-size="18" font-weight="600" fill="#f1f5f9">Smith 4</text>
<text x="74" y="174" font-size="14" fill="#94a3b8">Motor stopped; no restart since</text>
<text x="712" y="162" font-size="15" font-weight="600" fill="#ef4444" text-anchor="end">Down since 4:12 am</text>
<rect x="24" y="202" width="712" height="72" rx="12" fill="#111c33"/>
<circle cx="52" cy="238" r="8" fill="#ef4444"/>
<text x="74" y="233" font-size="18" font-weight="600" fill="#f1f5f9">Ridge 1</text>
<text x="74" y="256" font-size="14" fill="#94a3b8">Motor turning with almost no load: check belts and rods</text>
<text x="712" y="244" font-size="15" font-weight="600" fill="#ef4444" text-anchor="end">Running, no load</text>
<rect x="24" y="284" width="712" height="72" rx="12" fill="#111c33"/>
<circle cx="52" cy="320" r="8" fill="#f59e0b"/>
<text x="74" y="315" font-size="18" font-weight="600" fill="#f1f5f9">Ridge 3</text>
<text x="74" y="338" font-size="14" fill="#94a3b8">Pumps off after 3 h; timer set to 6 h</text>
<text x="712" y="326" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="end">Timer running long</text>
<rect x="24" y="366" width="712" height="72" rx="12" fill="#111c33"/>
<circle cx="52" cy="402" r="8" fill="#f59e0b"/>
<text x="74" y="397" font-size="18" font-weight="600" fill="#f1f5f9">Creek 7</text>
<text x="74" y="420" font-size="14" fill="#94a3b8">Different from this well's normal since yesterday</text>
<text x="712" y="408" font-size="15" font-weight="600" fill="#f59e0b" text-anchor="end">Something changed</text>
<rect x="24" y="448" width="712" height="72" rx="12" fill="#111c33"/>
<circle cx="52" cy="484" r="8" fill="#22c55e"/>
<text x="74" y="479" font-size="18" font-weight="600" fill="#f1f5f9">Smith 2</text>
<text x="74" y="502" font-size="14" fill="#94a3b8">Ran 7 h 40 min in 2 starts</text>
<text x="712" y="490" font-size="15" font-weight="600" fill="#22c55e" text-anchor="end">Running normally</text>
<rect x="24" y="530" width="712" height="72" rx="12" fill="#111c33"/>
<circle cx="52" cy="566" r="8" fill="#22c55e"/>
<text x="74" y="561" font-size="18" font-weight="600" fill="#f1f5f9">Creek 8</text>
<text x="74" y="584" font-size="14" fill="#94a3b8">Used 41 kWh yesterday, about $4.90</text>
<text x="712" y="572" font-size="15" font-weight="600" fill="#22c55e" text-anchor="end">Running normally</text>
</svg>